# Builds the site from source and publishes it to GitHub Pages.
#
# The bundle is deliberately not committed: Pages serves static files and runs no
# build of its own, so a hand-built artifact in the repo can silently go stale and
# leave the live page running old code. Building here makes that impossible.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy — let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Build first: the suite asserts against the bundle the page actually loads.
      - run: npm run build

      # Live checks against the Stacks APIs skip themselves when unreachable, so a
      # transient outage cannot fail a deploy — but it cannot mask a real break either.
      - run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
