# Builds the site from source and publishes it to GitHub Pages.
#
# Actions are pinned to full commit SHAs, which the org requires: a tag can be moved
# to point at different code, a commit SHA cannot. Bump these deliberately.
#
# The bundle is deliberately not committed: Pages serves static files and runs no
# build of its own, so a hand-built artifact in the repo can silently go stale and
# leave the live page running old code. Building here makes that impossible.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a half-finished deploy — let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Build first: the suite asserts against the bundle the page actually loads.
      - run: npm run build

      # Live checks against the Stacks APIs skip themselves when unreachable, so a
      # transient outage cannot fail a deploy — but it cannot mask a real break either.
      - run: npm test

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide: this is the only job that publishes.
    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC token deploy-pages exchanges for that deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
